# Explicit project name. Without this, Compose derives it from the directory
# name ("trip planner" -> "tripplanner"), which would leave volumes and the
# network carrying the old project name.
name: tripsync

services:
  postgres:
    image: postgres:16-alpine
    container_name: tripsync-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: tripsync
      POSTGRES_PASSWORD: tripsync_dev
      POSTGRES_DB: tripsync
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tripsync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
